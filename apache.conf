ServerName localhost

<VirtualHost *:80>
    # lang/locale: без них Python в Apache работает в локали C и не сохранит файлы с не-ASCII именами.
    WSGIDaemonProcess video processes=2 threads=15 python-path=/app lang=C.UTF-8 locale=C.UTF-8
    # process-group + application-group вместе заставляют загрузить .wsgi при старте процесса, а не при первом запросе.
    WSGIScriptAlias / /app/web_service.wsgi process-group=video application-group=%{GLOBAL}

    <Directory /app>
        <Files web_service.wsgi>
            Require all granted
        </Files>
    </Directory>

    # Загруженные видео отдаёт сам Apache, минуя Python; Range-запросы (перемотка) он поддерживает.
    # Незавершённые загрузки (*.part) лежат в той же папке, их не отдаём.
    RedirectMatch 404 "^/media/.*\.part$"
    Alias /media/ /app/uploads/
    <Directory /app/uploads>
        Options -Indexes
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
