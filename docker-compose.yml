x-db-env: &db-env
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:?DB_NAME is not set, copy .env.example to .env}
  DB_USER: ${DB_USER:?DB_USER is not set, copy .env.example to .env}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, copy .env.example to .env}

services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - uploads:/app/uploads
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy

  # Zoom-обработка загруженных видео: тот же образ (в нём ffmpeg), общий с web том uploads.
  worker:
    build: .
    command: ["python", "worker.py"]
    # Как Apache: web должен иметь право удалять файлы, созданные worker, и наоборот.
    user: www-data
    volumes:
      - uploads:/app/uploads
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy
    # Обрыв соединения с базой завершает worker; без перезапуска обработка остановилась бы.
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is not set, copy .env.example to .env}
      POSTGRES_USER: ${DB_USER:?DB_USER is not set, copy .env.example to .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, copy .env.example to .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads:
